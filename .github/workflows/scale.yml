# Scale check: a nightly run on 5,000 synthetic students must finish in under 30 minutes.
# Runs on every push to main and weekly, in parallel with CI and without holding its result up;
# look at both. Also runnable by hand for any branch: gh workflow run scale.yml --ref <branch>

name: Scale

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-5000:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Throwaway CI-only service credentials, not real secrets.
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Migrations
        run: alembic upgrade head

      - name: 5,000-student nightly run
        run: pytest tests/jobs -m slow --durations=5
