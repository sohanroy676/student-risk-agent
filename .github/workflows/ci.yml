# CI pipeline. Runs on every push and PR to main, and manually via workflow_dispatch.
# Mirrors the commands in AGENTS.md / CLAUDE.md: ruff check, ruff format --check, mypy, alembic, pytest.
#
# The suite runs as parallel jobs so a run takes as long as its slowest job, not the sum:
#   checks   - lint, format, types and every test that needs no database (no services)
#   database - the Postgres tests, split into shards that each get their own Postgres
#   web      - the web app: lint, formatting, types, build and the Playwright flows (API faked)
#   secrets  - gitleaks over the full history
# The 5,000-student nightly run (the `slow` marker) is not here: scale.yml runs it on its own, so
# its seven minutes do not hold up this result.
# A database test is tagged `postgres` automatically (tests/conftest.py). Every folder that holds
# one must be listed in a shard below; tests/test_ci_layout.py fails if one is missing.
# Rebalance the shards from the `slowest 15 durations` printed at the end of each job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests that need no database
        run: pytest -m "not postgres" --durations=15

  database:
    name: database (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: schema, rls, audit
            paths: tests/db tests/features tests/core
            marker: postgres and not slow
          - name: ingest, jobs
            paths: tests/ingest tests/jobs
            marker: postgres and not slow
          - name: cases, api
            paths: tests/cases tests/api tests/agent
            marker: postgres and not slow

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Throwaway CI-only service credentials, not real secrets.
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Migrations
        run: alembic upgrade head

      - name: Database tests
        run: pytest ${{ matrix.paths }} -m "${{ matrix.marker }}" --durations=15

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Type check
        run: npm run typecheck

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (they build the app first)
        run: npx playwright test

      - name: Keep the report if a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the gitleaks scan

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
