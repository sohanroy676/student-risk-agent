# CI pipeline. Runs on every push and PR to main, and manually via workflow_dispatch.
# Mirrors the commands in AGENTS.md / CLAUDE.md: ruff check, ruff format --check, mypy app, pytest.
#
# The repo is still in v0.1 setup (no requirements files, app/ or tests/ yet), so the
# install and test steps tolerate their absence. Once the code exists, remove the
# "bootstrap tolerance" bits marked below so CI fails loudly on a missing suite.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # Throwaway CI-only service credentials, not real secrets.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the gitleaks scan

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # bootstrap tolerance: files may not exist yet
          for f in requirements.txt requirements-dev.txt; do
            if [ -f "$f" ]; then pip install -r "$f"; fi
          done
          # ensure the quality tools exist even if not yet listed in requirements
          pip install ruff mypy pytest hypothesis

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: |
          # bootstrap tolerance: skip until app/ exists
          if [ -d app ]; then mypy app; else echo "app/ not present yet, skipping mypy"; fi

      - name: Run tests
        run: |
          # bootstrap tolerance: pytest exits 5 when no tests are collected
          pytest || { code=$?; [ "$code" -eq 5 ] && echo "No tests collected yet" || exit "$code"; }

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
