[project]
name = "student-risk-agent"
version = "0.1.0"
description = "Early-warning module for college ERP: nightly student risk scoring and mentor-approved interventions."
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"evals/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["sklearn.*", "fairlearn.*", "celery.*", "kombu.*"]
ignore_missing_imports = true
